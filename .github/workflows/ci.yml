name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_URI: mongodb://localhost:27017
      DB_NAME: darkweb_ci
      ELASTICSEARCH_URL: http://localhost:9200
      KIBANA_URL: http://localhost:5601
      TELEGRAM_TOKEN: ci-token
      TELEGRAM_CHAT_ID: "-1000000000000"
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      ELK_INDEX_PREFIX: darkweb-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python DjangoProject/manage.py test mongoDbConnect -v 2
      - run: python DjangoProject/manage.py check
      - run: python scripts/check_secrets.py
      - run: python -m compileall -q crawling alert governance scheduler DjangoProject elk scripts tests
