name: 저장소 문서와 경로 일회성 검사

on:
  push:
    branches:
      - refactor/public-repository-structure-20261109

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 전체 저장소 문서 링크와 이전 파일 경로 검사
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          from collections import defaultdict
          import hashlib, json, re, subprocess
          root=Path.cwd()
          paths=[p.decode("utf-8") for p in subprocess.check_output(["git","ls-files","-z"]).split(b"\0") if p]
          files=set(paths)
          md=sorted(p for p in paths if p.lower().endswith(".md"))
          bad_links=[]
          link_count=0
          stale=[]
          is_infra="infrastructure-security-scanner" in root.name
          old_names=([
           "docs/portfolio-evidence-mapping.md",
           "portfolio-evidence-mapping.md",
           "docs/kisa-2026-interview.md",
           "examples/day5-demo",
           "lab/day2/",
           "lab/day3/",
           "lab/phase2-linux-mysql",
           "lab/phase2-network",
           "lab/phase2-packet",
           "lab/phase2-web-was",
           "infra/aws/phase2-audit-lab",
           "scripts/generate_day5_sample",
           "scripts.generate_day5_sample",
           "tests/test_portfolio_sample",
           "run_day2_audit",
           "run_day3_audit",
           "run_day4_audit",
           "day3.rules",
          ] if is_infra else [
           "DjangoProject/manage.py",
           "DjangoProject/mongoDbConnect",
           "DjangoProject.settings",
           "DjangoProject.urls",
           "DjangoProject/",
           "static/assets/demo/",
           "static/css/styles.css",
           "static/js/scripts.js",
          ])
          for path in paths:
           if path==".github/workflows/_temporary_file_audit.yml":
            continue
           source=root/path
           try:
            content=source.read_text("utf-8")
           except (OSError,UnicodeError):
            continue
           if path.endswith(".md"):
            for match in re.finditer(r"\]\(([^)\r\n]+)\)", content):
             url=match.group(1).strip().strip("<>").split(' "',1)[0].split(" '",1)[0]
             if url.startswith("#") or not url:
              continue
             parsed=urlsplit(url)
             if parsed.scheme or parsed.netloc or url.startswith("//"):
              continue
             target=unquote(parsed.path)
             if not target:
              continue
             link_count+=1
             dest=((source.parent/target) if not target.startswith("/") else root/target.lstrip("/")).resolve()
             try:dest.relative_to(root)
             except ValueError:
              bad_links.append([path,url,"outside-root"])
              continue
             if not dest.exists():
              bad_links.append([path,url,"not-found"])
           if path.endswith((".py",".md",".yml",".yaml",".json",".toml",".tf",".js",".sh",".ps1",".html",".css",".conf",".txt")):
            for name in old_names:
             if name in content:
              stale.append([path,name])
          groups=defaultdict(list)
          for path in paths:
           groups[hashlib.sha256((root/path).read_bytes()).hexdigest()].append(path)
          duplicates=[items for items in groups.values() if len(items)>1]
          print("AUDITED_FILES",len(paths),"MARKDOWN_FILES",len(md),"RELATIVE_LINKS",link_count,flush=True)
          print("MISSING_MARKDOWN_LINKS",json.dumps(bad_links,ensure_ascii=False),flush=True)
          print("OBSOLETE_PATH_REFERENCES",json.dumps(stale[:100],ensure_ascii=False),flush=True)
          print("DUPLICATE_BINARY_GROUPS",json.dumps(duplicates[:20],ensure_ascii=False),flush=True)
          if bad_links or stale:
           raise SystemExit("Repository naming and link audit failed")
          print("REPOSITORY_AUDIT_SUCCESS",flush=True)
          

          PY
